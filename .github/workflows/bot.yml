name: FB Video Bot

on:
  schedule:
    - cron: '0 */6 * * *' # প্রতি ৬ ঘণ্টা পর পর রান হবে
  workflow_dispatch: # ম্যানুয়ালি টেস্ট করার বাটন

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install libraries
      run: |
        pip install requests yt-dlp
        sudo apt-get install -y ffmpeg
        
    - name: Run Bot
      env:
        FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        PAGE_ID: ${{ secrets.PAGE_ID }}
      run: python main.py
